name: Chromium smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Launch Chromium and verify local HTML rendering
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.setContent(`
              <!doctype html>
              <html>
                <head><title>Chromium Smoke Test</title></head>
                <body><h1 id="status">Chromium is working</h1></body>
              </html>
            `, { waitUntil: 'load' });

            const title = await page.title();
            const heading = await page.locator('#status').textContent();

            console.log('Page title:', title);
            console.log('Rendered content:', heading);
            console.log('User agent:', await page.evaluate(() => navigator.userAgent));

            if (title !== 'Chromium Smoke Test' || heading !== 'Chromium is working') {
              throw new Error('Chromium smoke test failed: local HTML did not render as expected');
            }

            console.log('PASS: Chromium launched and rendered local HTML successfully.');
          } finally {
            await browser.close();
          }
          NODE
