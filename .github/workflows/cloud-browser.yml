name: Cloud Browser Session

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-browser-session
  cancel-in-progress: true

jobs:
  browser:
    name: Run Chromium desktop and Cloudflare Quick Tunnel
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check required secrets
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$VNC_PASSWORD" || ${#VNC_PASSWORD} -lt 6 || ${#VNC_PASSWORD} -gt 8 ]]; then
            echo "::error::Missing VNC_PASSWORD secret (must be 6–8 characters for classic VNC authentication)."
            exit 1
          fi

      - name: Install desktop, current Chromium, legacy-compatible noVNC and tunnel dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb fluxbox x11vnc websockify x11-xserver-utils python3-websocket
          # Pin the classic ES5-based noVNC client instead of Ubuntu's modern package.
          sudo mkdir -p /opt/novnc-legacy
          curl -fsSL https://github.com/novnc/noVNC/archive/refs/tags/v0.6.2.tar.gz | sudo tar -xz --strip-components=1 -C /opt/novnc-legacy
          mkdir -p "$HOME/.cache/ms-playwright"
          npx --yes playwright@1.56.1 install chromium
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          chromium_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -n 1)"
          if [[ -z "$chromium_path" ]]; then
            echo "::error::Playwright Chromium executable was not found."
            exit 1
          fi
          echo "CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"

      - name: Start virtual desktop and Chromium
        shell: bash
        env:
          BROWSER_URLS: ${{ vars.BROWSER_URLS }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 240x320x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          sleep 2
          fluxbox >/tmp/fluxbox.log 2>&1 &
          mkdir -p "$HOME/cloud-browser-profile"
          urls="${BROWSER_URLS:-about:blank,about:blank,about:blank}"
          IFS=',' read -r -a tabs <<< "$urls"
          args=()
          for url in "${tabs[@]:0:3}"; do
            args+=("$url")
          done
          "$CHROMIUM_PATH" \
            --no-sandbox \
            --disable-dev-shm-usage \
            --user-data-dir="$HOME/cloud-browser-profile" \
            --no-first-run \
            --disable-session-crashed-bubble \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --window-size=240,320 \
            --kiosk \
            "${args[@]}" >/tmp/chromium.log 2>&1 &
          sleep 5
          # Switch between portrait and landscape when a page enters/exits HTML fullscreen.
          cat >/tmp/orientation.py <<'PY'
          import json
          import time
          import urllib.request
          import subprocess
          import websocket

          current = "240x320"

          def is_fullscreen():
              try:
                  with urllib.request.urlopen("http://127.0.0.1:9222/json", timeout=2) as response:
                      targets = json.load(response)
                  for target in targets:
                      if target.get("type") != "page" or not target.get("webSocketDebuggerUrl"):
                          continue
                      ws = None
                      try:
                          ws = websocket.create_connection(target["webSocketDebuggerUrl"], timeout=2, origin="http://localhost")
                          ws.send(json.dumps({"id": 1, "method": "Runtime.evaluate", "params": {"expression": "!!document.fullscreenElement", "returnByValue": True}}))
                          result = json.loads(ws.recv())
                          if result.get("result", {}).get("result", {}).get("value") is True:
                              return True
                      except Exception:
                          pass
                      finally:
                          if ws:
                              ws.close()
              except Exception:
                  pass
              return False

          while True:
              desired = "320x240" if is_fullscreen() else "240x320"
              if desired != current:
                  subprocess.run(["xrandr", "--fb", desired], check=False)
                  print("Display orientation:", desired, flush=True)
                  current = desired
              time.sleep(0.5)
          PY
          python3 /tmp/orientation.py >/tmp/orientation.log 2>&1 &
          echo $! >/tmp/orientation.pid
          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc-passwd >/dev/null
          x11vnc -display :99 -forever -shared -rfbport 5900 \
            -rfbauth /tmp/vnc-passwd -localhost 2>/tmp/x11vnc.log &
          websockify --web=/opt/novnc-legacy 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          sleep 2
          if ! curl -fsS http://localhost:6080/vnc.html >/dev/null; then
            echo "::error::noVNC did not start."
            exit 1
          fi
          echo "Chromium desktop is ready on localhost:6080."

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          cloudflared tunnel --no-autoupdate --url http://localhost:6080 --loglevel info >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          tunnel_url=""
          for attempt in $(seq 1 30); do
            tunnel_url="$(grep -Eo 'https://[a-z0-9-]+\\.trycloudflare\\.com' /tmp/cloudflared.log 2>/dev/null | head -n 1 || true)"
            if [[ -n "$tunnel_url" ]]; then
              break
            fi
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              cat /tmp/cloudflared.log 2>/dev/null || true
              echo "::error::Cloudflare Quick Tunnel failed to start."
              exit 1
            fi
            sleep 2
          done
          if [[ -z "$tunnel_url" ]]; then
            cat /tmp/cloudflared.log 2>/dev/null || true
            echo "::error::Timed out waiting for the trycloudflare.com URL."
            exit 1
          fi
          echo "Quick Tunnel is ready: $tunnel_url"
          {
            echo "## Remote Chromium desktop"
            echo ""
            echo "**Open:** $tunnel_url/vnc.html?autoconnect=true&resize=remote"
            echo ""
            echo "Enter the repository VNC_PASSWORD when prompted."
            echo ""
            echo "This temporary Quick Tunnel URL changes on each run. Keep it private; VNC authentication is required to access the desktop."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep session alive
        shell: bash
        run: |
          echo "Remote Chromium is running. This GitHub-hosted session is temporary (maximum about 5h50m)."
          for i in $(seq 1 345); do
            sleep 60
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "::error::Cloudflare Tunnel stopped."
              exit 1
            fi
          done

      - name: Show diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for f in /tmp/xvfb.log /tmp/fluxbox.log /tmp/chromium.log /tmp/orientation.log /tmp/x11vnc.log /tmp/websockify.log /tmp/cloudflared.log; do
            if [[ -f "$f" ]]; then
              echo "===== $f ====="
              tail -n 80 "$f" || true
            fi
          done
