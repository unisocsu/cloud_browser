name: Cloud Browser Session

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-browser-session
  cancel-in-progress: true

jobs:
  browser:
    name: Run Chromium desktop and Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check required secrets
        shell: bash
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARED_TUNNEL_TOKEN }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TUNNEL_TOKEN" ]]; then
            echo "::error::Missing CLOUDFLARED_TUNNEL_TOKEN repository secret."
            exit 1
          fi
          if [[ -z "$VNC_PASSWORD" || ${#VNC_PASSWORD} -lt 6 ]]; then
            echo "::error::Missing VNC_PASSWORD secret (minimum 6 characters)."
            exit 1
          fi

      - name: Install desktop, Chromium, noVNC and tunnel dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb fluxbox x11vnc novnc websockify
          mkdir -p "$HOME/.cache/ms-playwright"
          npx --yes playwright@1.56.1 install --with-deps chromium
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          chromium_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -n 1)"
          if [[ -z "$chromium_path" ]]; then
            echo "::error::Playwright Chromium executable was not found."
            exit 1
          fi
          echo "CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"

      - name: Start virtual desktop and Chromium
        shell: bash
        env:
          BROWSER_URLS: ${{ vars.BROWSER_URLS }}
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          sleep 2
          fluxbox >/tmp/fluxbox.log 2>&1 &
          mkdir -p "$HOME/cloud-browser-profile"
          urls="${BROWSER_URLS:-about:blank,about:blank,about:blank}"
          IFS=',' read -r -a tabs <<< "$urls"
          args=()
          for url in "${tabs[@]:0:3}"; do
            args+=("$url")
          done
          "$CHROMIUM_PATH" \
            --no-sandbox \
            --disable-dev-shm-usage \
            --user-data-dir="$HOME/cloud-browser-profile" \
            --no-first-run \
            --disable-session-crashed-bubble \
            --window-size=1280,800 \
            "${args[@]}" >/tmp/chromium.log 2>&1 &
          sleep 5
          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc-passwd >/dev/null
          x11vnc -display :99 -forever -shared -rfbport 5900 \
            -rfbauth /tmp/vnc-passwd -localhost 2>/tmp/x11vnc.log &
          websockify --web=/usr/share/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          sleep 2
          if ! curl -fsS http://localhost:6080/vnc.html >/dev/null; then
            echo "::error::noVNC did not start."
            exit 1
          fi
          echo "Chromium desktop is ready on localhost:6080."

      - name: Start Cloudflare Tunnel
        shell: bash
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARED_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          cloudflared tunnel run --no-autoupdate --token "$TUNNEL_TOKEN" >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          sleep 8
          if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
            cat /tmp/cloudflared.log
            echo "::error::Cloudflare Tunnel failed to start. Check the tunnel token and Public Hostname route."
            exit 1
          fi
          echo "Tunnel process started. Open your Cloudflare Access-protected hostname at /vnc.html?autoconnect=true&resize=remote"

      - name: Keep session alive
        shell: bash
        run: |
          echo "Remote Chromium is running. This GitHub-hosted session is temporary (maximum about 5h50m)."
          for i in $(seq 1 345); do
            sleep 60
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "::error::Cloudflare Tunnel stopped."
              exit 1
            fi
          done

      - name: Show diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for f in /tmp/xvfb.log /tmp/fluxbox.log /tmp/chromium.log /tmp/x11vnc.log /tmp/websockify.log /tmp/cloudflared.log; do
            if [[ -f "$f" ]]; then
              echo "===== $f ====="
              tail -n 80 "$f" || true
            fi
          done
